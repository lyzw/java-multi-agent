# CI 流水线
#
# 设计要点：
#   1. 单元测试与集成测试分离 —— 集成测试需 PG，快速反馈优先
#   2. 集成测试用 **非特权角色**（app_agent）：超级用户绕过 RLS，
#      用它跑租户隔离测试会得到「隔离失效」的虚假结论
#   3. 配置契约断言单独成 job —— 这是防「静默失效」的关键闸门
#   4. 依赖漏洞扫描独立 job —— 失败不阻塞构建但需可见
#
# ⚠️ 2026-10-22 实测修订（本文件此前**从未在 Runner 上真实运行过**，因此隐藏着 3 个必红/假绿缺陷）：
#   a) `mvn ... | tee log` 吞掉构建退出码（默认 shell `bash -e` 无 pipefail）→ 失败仍报绿；
#   b) unit-test job 无库 → 29 项「装配测试」报错（它们需要**活库且已建表**）→ 构建必红；
#   c) integration-test job 无 RabbitMQ，而 RealBrokerEndToEndIT **没有跳过门禁** → 3 项 ERROR 拖垮构建。
#   三处均已修复；修复依据是本机实跑日志，不是推断。
#
# ⚠️ P4-D17：消息通道默认走 **database**（PostgreSQL 队列）→ 本 CI **不需要 RabbitMQ service**。
#    RabbitMQ 通道完整保留（`AGENT_MESSAGING_MODE=rabbitmq` 即切回），
#    但 broker 端到端（E-1/E-2/E-3）**仍不在 CI 覆盖范围内**（需另加 rabbitmq service）。
#
# 触发：push / PR / 手动。分支 master、develop 受保护，强制要求 CI 通过。

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

# 同分支的旧运行取消，避免浪费配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_VERSION: '3.10.0'
  # ⚠️ 必须与 DEC-13 一致。PG 14 已 EOL，禁止使用
  PG_IMAGE: 'postgres:17'

jobs:
  # ── 1. 单元测试（快速反馈）────────────────────────────────────
  unit-test:
    name: 构建与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 编译、打包并运行单元测试
        working-directory: platform
        # ⚠️⚠️ 这里**故意只跑到 package**（2026-10-22 修改）：
        #    原命令是 `mvn clean verify`，而本 job 不提供 IT_PG_URL，
        #    于是 249 项集成测试被 @EnabledIfEnvironmentVariable 整体跳过，
        #    界面依旧显示“构建与单元测试 ✅ 通过”——绿得没有意义。
        #    现在 IT 由 integration-test job 跑**全 reactor**，并断言**跳过数为 0**。
        #    单元/集成职责分开，比“同一命令跑两遍、其中一遍全跳过”诚实。
        #
        # ⚠️⚠️ `set -o pipefail` 是**必须**的（2026-10-22 实测补）：
        #    GitHub Actions 的 `run:` 默认 shell 是 `bash -e {0}`，**不含 pipefail**。
        #    而 `mvn ... | tee log` 的退出码取自 **tee**（恒为 0）——
        #    实测：`bash -e -c 'false | tee /tmp/x; echo $?'` → 0。
        #    即：**构建失败该步骤仍报绿**。这是 F-14/CP-1/CP-2 同一形态的
        #    「在反假绿脚本里自己造假绿」，故此处显式开启 pipefail。
        run: |
          set -o pipefail
          mvn -B clean package 2>&1 | tee /tmp/ci-unit.log

      # ⚠️ 单元测试阶段**没有库**，故允许「需要库的测试」被跳过（门禁见 IT_PG_URL）。
      #    但「跳过的数量」必须是**已知且有限**的：若某天新增的测试被误门禁，
      #    跳过数会悄悄变大 —— 故设上限，而不是放任。
      - name: 断言单元测试真实执行
        run: |
          # 只取**模块汇总行**（行尾即 Skipped: N）。逐类明细行带
          # ", Time elapsed: ... -- in ..."，锚定行尾可将其排除，
          # 否则计数会翻倍（实测：无库场景未锚定 366 vs 真实 180）。
          summary() { grep -oE "Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$" "$1"; }
          ran=$(summary /tmp/ci-unit.log | grep -oE "^Tests run: [0-9]+" | grep -oE "[0-9]+" | awk '{s+=$1} END {print s+0}')
          failed=$(summary /tmp/ci-unit.log | grep -oE "Failures: [0-9]+" | grep -oE "[0-9]+" | awk '{s+=$1} END {print s+0}')
          errors=$(summary /tmp/ci-unit.log | grep -oE "Errors: [0-9]+" | grep -oE "[0-9]+" | awk '{s+=$1} END {print s+0}')
          skipped=$(summary /tmp/ci-unit.log | grep -oE "Skipped: [0-9]+" | grep -oE "[0-9]+" | awk '{s+=$1} END {print s+0}')
          echo "单元测试：执行 $ran 项 / 失败 $failed / 错误 $errors / 跳过 $skipped"
          if [ "$failed" -ne 0 ] || [ "$errors" -ne 0 ]; then
            echo "❌ 单元测试存在失败或错误"; exit 1
          fi
          # 下限取 2026-10-22 本机实测基线（无库场景 524 项）；
          # 低于此说明环境退步（如模块未构建），而不是「代码变好了所以测得少」。
          if [ "$ran" -lt 480 ]; then
            echo "❌ 仅执行 $ran 项，低于实测基线 524 —— 请检查构建环境"; exit 1
          fi
          # 上限：已知需库而跳过的测试 = 4 个装配测试类 + 既有库门禁 + 通道相关 IT
          #      = 25（2026-10-22 实测；整类被门禁时 JUnit 按类容器记 1 项）
          if [ "$skipped" -gt 60 ]; then
            echo "❌ 跳过 $skipped 项，超出已知需库集合（25）—— 有测试被误门禁"; exit 1
          fi
          echo "✅ 单元测试真实执行且无失败"

      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: platform/platform-bootstrap/target/*.jar
          retention-days: 7

  # ── 2. 配置契约断言（防静默失效）────────────────────────────
  config-contract:
    name: 配置契约与门禁断言
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # ApplicationConfigTest 断言：
      #   · delivery-limit = 3（否则退回 quorum 默认 20 → 重复写入 Sev-0）
      #   · 零保留供应商清单非空、有效期为正
      #   · WRITE_EXTERNAL = REQUIRED（审批不可放松）
      #   · 无明文口令
      # 这些断言失败意味着**安全机制已静默失效**，故单独成 job 以便快速定位。
      - name: 运行配置契约测试
        working-directory: platform
        run: mvn -B -pl platform-bootstrap test -Dtest=ApplicationConfigTest

      - name: 领域层纯净度检查
        working-directory: platform
        run: mvn -B -pl agent-core test -Dtest=AgentCorePurityTest
        # AgentCorePurityTest 禁止领域层引入 Spring/Jakarta/Hibernate/Flyway/
        # MQ SDK/PG 驱动/logback。破了它，ADR-011 的回滚收益即消失。

  # ── 3. 集成测试（真实 PG 17）─────────────────────────────────
  integration-test:
    name: 集成测试（PostgreSQL 17）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit-test
    services:
      postgres:
        image: ${{ env.PG_IMAGE }}
        env:
          # ⚠️ 集成测试需要创建角色，故必须用超级用户初始化容器；
          #    但**应用连接仍使用 app_agent 非特权角色**
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: agent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 安装 PostgreSQL 客户端
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: 执行迁移（V1~V12 全量按序）+ 种子
        env:
          PGPASSWORD: ci_only_not_a_secret
        run: |
          cd platform/agent-infrastructure/src/main/resources/db/migration
          # ⚠️⚠️ 必须**全量按序**（2026-10-22 修复）：原先只跑 V1__baseline_schema.sql，
          #    而 IT 用到的 V7 rate_limit_bucket、V8 retention/erasure、
          #    V11 tenant_config_override、V12 config_change_request 全不存在——
          #    该 job 从未在 Runner 上真实跑过，所以缺陷一直没暴露。
          #    排序用 sort -t_ -k1.2 -n（按 V 后面的数字），不依赖字典序。
          for f in $(ls V*.sql | sort -t_ -k1.2 -n); do
            echo "--- $f ---"
            # ⚠️ 先钉死 search_path，防止未限定表名因连接角色默认 schema 非 public 而建错位置
            psql -h 127.0.0.1 -U postgres -d agent_ci -v ON_ERROR_STOP=1 -q -c "SET search_path TO public;" -f "$f"
          done
          # ⚠️ 种子必须在**管理角色**下跑：以非特权角色执行会被 RLS 拒
          # （new row violates row-level security policy）——种子层与测试层必须分层。
          psql -h 127.0.0.1 -U postgres -d agent_ci -v ON_ERROR_STOP=1 -q -f verify/V1_seed.sql

      - name: 创建非特权验证角色
        env:
          PGPASSWORD: ci_only_not_a_secret
        run: |
          psql -h 127.0.0.1 -U postgres -d agent_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='app_agent') THEN
              CREATE ROLE app_agent NOSUPERUSER NOBYPASSRLS LOGIN PASSWORD 'ci_app_not_a_secret';
            ELSE
              ALTER ROLE app_agent NOSUPERUSER NOBYPASSRLS LOGIN PASSWORD 'ci_app_not_a_secret';
            END IF;
          END $$;
          GRANT USAGE ON SCHEMA public TO app_agent;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_agent;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_agent;
          SQL
          # ⚠️ GRANT 必须逐条执行。整段放一个事务里，任意一条失败会连带回滚全部
          #    GRANT，表现为「授权数=0」却无明显报错。

      - name: 验证 DDL 约束（15 项）
        env:
          PGPASSWORD: ci_app_not_a_secret
        run: |
          psql -h 127.0.0.1 -U app_agent -d agent_ci -f platform/agent-infrastructure/src/main/resources/db/migration/verify/V1_constraint_check.sql

      # ⚠️⚠️ 跑**全 reactor** 而不是只 -pl agent-infrastructure（2026-10-22 修复）：
      #    原命令只跑基础设施层，而 platform-bootstrap 的 67 项 IT
      #    （PlatformSecurityE2ETest 15 / GovernanceEndpointIT 19 /
      #    ConfigOverrideEndpointIT 11 / AgentEndpointIT 9 / ReadEndpointIT 12 …）
      #    —— 包含全部 HTTP 端点契约与 D-001 E2E —— **在 CI 里一次都不会执行**。
      - name: 运行集成测试（全 reactor）
        working-directory: platform
        env:
          IT_PG_URL: jdbc:postgresql://127.0.0.1:5432/agent_ci
          IT_PG_USER: app_agent
          IT_PG_PASSWORD: ci_app_not_a_secret
          # ⚠️ 管理员池（造跨租户夹具）用的是另一个角色，**必须单独给口令**：
          #    缺失时报「server requested password-based authentication,
          #    but no password was provided」，表现为 18 个 IT 类整体无法启动。
          IT_PG_ADMIN_USER: postgres
          IT_PG_ADMIN_PASSWORD: ci_only_not_a_secret
          # ⚠️ P4-D17：消息通道走 **database**（PostgreSQL 队列）——
          #    故本 job **不需要 RabbitMQ service**。
          #    显式声明而非依赖 yml 缺省：yml 缺省一改，CI 的行为就静默变了。
          AGENT_MESSAGING_MODE: database
        # ⚠️ `set -o pipefail` 是**必须**的（2026-10-22 实测补）：
        #    默认 shell 是 `bash -e {0}`，不含 pipefail；`mvn | tee` 的退出码
        #    取自 tee（恒 0）→ **构建失败仍报绿**。实测：bash -e 下 false|tee → 0。
        #
        # ⚠️ 排除 RealBrokerEndToEndIT（2026-10-22 实测）：该 IT **没有跳过门禁**
        #    （源码注释明写「没有 broker 的环境跑此 IT 会失败」），本 job 无 RabbitMQ
        #    service → 它会以 3 项 ERROR 拖垮整个构建（实测 3 errors / 0 skipped）。
        #    它已在本机以真实 broker 验通（2026-10-22：E-1/E-2/E-3 全绿），
        #    但 **CI 仍未覆盖 broker IT** —— 属已知缺口，见进度台账。
        run: |
          set -o pipefail
          # ⚠️ 同时排除 **MessagingCanaryWiringTest**（2026-10-23 实测补）：
          #    它在 @TestPropertySource 里把通道强制设为 rabbitmq，
          #    而应用的 fail-closed 守卫会在**broker 不可达时拒绝启动上下文**
          #    （"通道启用却连不上 = 消息永远不消费"）→ 无 broker 的 job 里 3 项 ERROR。
          #    本 job 没有 RabbitMQ service（见上方 AGENT_MESSAGING_MODE 说明），
          #    故与 RealBrokerEndToEndIT 同样处理；有 broker 的环境请单独跑它。
          #
          # ⚠️⚠️⚠️ `-Dtest` **必须带正向模式**（2026-10-23 实测踩坑）：
          #    写成 `-Dtest='!MessagingCanaryWiringTest'`（**纯排除**）时，
          #    surefire 的扫描集合会从「默认 includes」退化成「**全部类**」——
          #    于是 38 个 `*IT` 类被拉进**单元测试**阶段跑，
          #    `RealBrokerEndToEndIT`（无跳过门禁）当场 3 项 ERROR 拖垮构建，
          #    且 failsafe 阶段根本没开始跑（IT 全部没执行 → 「绿但没跑」）。
          #    实测对照（agent-infrastructure 模块）：
          #      `-Dtest='!MessagingCanaryWiringTest'` → 扫到 38 个 *IT / 432 项 / 3 ERROR
          #      `-Dtest='Test*,*Test,*Tests,*TestCase,!MessagingCanaryWiringTest'`
          #                                     → 扫到 0 个 *IT / 141 项 / 0 ERROR
          #    下面这四个正向模式 = surefire 的默认 includes（Test* / *Test /
          #    *Tests / *TestCase），逐个写出来是为了**显式复现默认行为**，
          #    而不是为了改变它。少写一个 → 该类在本 job 里静默不跑。
          #    （对比：`-Dit.test` 带正向模式时排除是生效的，实测
          #      `!RealBrokerEndToEndIT` 出现 0 次 → 排除有效。）
          mvn -B clean verify \
            -Dtest='Test*,*Test,*Tests,*TestCase,!MessagingCanaryWiringTest' \
            -Dit.test='*IT,!RealBrokerEndToEndIT' \
            -Dfailsafe.failIfNoSpecifiedTests=false 2>&1 | tee /tmp/ci-it.log

      # ⚠️⚠️ **跳过必须判失败**（2026-10-22 新增）：
      #    没有 IT_PG_URL 时 IT 会被 @EnabledIfEnvironmentVariable 整体跳过，
      #    而构建依旧 BUILD SUCCESS —— 这是本项目反复踩的 F-14/CP-1/CP-2 同形态。
      #    「绿但一条没跑」与「真绿」在 CI 界面上长得一模一样，故在此拆穿。
      - name: 断言集成测试确实执行（跳过数必须为 0）
        run: |
          # ⚠️ 只取**模块汇总行**（行尾即 Skipped: N，无逗号尾巴）。
          #    若误抓逐类明细行（带 ", Time elapsed: ... -- in ..."），
          #    计数会翻倍——实测无库场景：未锚定 366 vs 真实 180，
          #    报出来的数字是假的。下限断言也会因此永远为真。
          summary() { grep -oE "Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$" "$1"; }
          ran=$(summary /tmp/ci-it.log | grep -oE "^Tests run: [0-9]+" | grep -oE "[0-9]+" | awk '{s+=$1} END {print s+0}')
          failed=$(summary /tmp/ci-it.log | grep -oE "Failures: [0-9]+" | grep -oE "[0-9]+" | awk '{s+=$1} END {print s+0}')
          errors=$(summary /tmp/ci-it.log | grep -oE "Errors: [0-9]+" | grep -oE "[0-9]+" | awk '{s+=$1} END {print s+0}')
          skipped=$(summary /tmp/ci-it.log | grep -oE "Skipped: [0-9]+" | grep -oE "[0-9]+" | awk '{s+=$1} END {print s+0}')
          echo "集成测试：执行 $ran 项 / 失败 $failed / 错误 $errors / 跳过 $skipped"
          if [ "$failed" -ne 0 ] || [ "$errors" -ne 0 ]; then
            echo "❌ 集成测试存在失败或错误"; exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "❌ 有 $skipped 项被跳过 —— IT 未真正执行，构建绿不等于验证过"
            exit 1
          fi
          # 下限取 2026-10-23 本机实测基线（1289 全绿 / 0 跳过 = 单测 872 + IT 417）；
          # 低于此说明环境退步（如模块未构建、迁移未执行、角色未建），
          # 而不是“代码变好了所以测得少”。
          # 下限取 1000 而非 1289，是给 CI 的 PG 17 容器与本机 PG 18.6 留余量。
          if [ "$ran" -lt 1000 ]; then
            echo "❌ 仅执行 $ran 项，低于实测基线 1289 —— 请检查构建环境"
            exit 1
          fi
          echo "✅ 集成测试真实执行且零跳过"

  # ── 4. 依赖漏洞扫描（不阻塞，但需可见）───────────────────────
  dependency-scan:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true    # 扫描结果不阻塞构建，但会在 PR 中可见
    steps:
      - uses: actions/checkout@v4

      - name: 依赖树与已知漏洞扫描
        working-directory: platform
        run: mvn -B org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=7 \
          -DsuppressionFile=../docs/security-suppressions.xml || true
        # ⚠️ OWASP 数据库首次下载较慢；CI 缓存后可接受
        # ⚠️ 漏洞库滞后于依赖发布，故不设阻塞；高危项须人工复核

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: platform/dependency-check-report.xml
          retention-days: 30
          if-no-files-found: ignore

  # ── 5. 门禁汇总 ────────────────────────────────────────────
  gate:
    name: 质量门禁
    runs-on: ubuntu-latest
    needs: [unit-test, config-contract, integration-test]
    if: always()
    steps:
      # ⚠️ 必须用 needs.<job>.result 判定，不能用 job.status ——
      #    后者读的是本 job 自身状态，会永远显示「通过」。
      - name: 判定结果
        env:
          UNIT: ${{ needs.unit-test.result }}
          CONFIG: ${{ needs.config-contract.result }}
          INTEGRATION: ${{ needs.integration-test.result }}
        run: |
          failed=0
          for entry in "单元测试:$UNIT" "配置契约断言:$CONFIG" "集成测试:$INTEGRATION"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [ "$result" = "success" ]; then
              echo "$name  ✅ 通过"
            else
              echo "$name  ❌ $result"
              failed=1
            fi
          done

          echo ""
          if [ "$failed" -ne 0 ]; then
            echo "❌ 门禁未通过 —— 禁止合并"
            exit 1
          fi
          echo "✅ 门禁通过"
          echo ""
