# P1 工程基线配置模板
#
# 依据 P0-D00《决策基线》v1.1 §1.2 / §1.4（DEC-9 / DEC-11）
#
# ⚠️ fail-closed 约定：
#   下列每项都是**必填**。缺失或非法时应用应**拒绝**启动/拒绝创建 Run，
#   而不是退回默认值放行（P0-D03 §4 红线 15、R-020）。
#   注释中的「保守初值」仅用于生成模板与文档标注，不参与运行时兜底。

spring:
  application:
    name: java-saas-agent-platform

  # ── Flyway / 数据源 schema 钉死（防 agent 等业务表漂到非 public schema）──
  # 迁移脚本全部使用未限定表名；default-schema 明确指向 public，与
  # deploy/sql/platform/05_platform_identity_ddl.sql 的设计一致：
  #   public = 租户业务表（带 RLS）；platform = 平台身份域（无 RLS）。
  # connection-init-sql 让 HikariCP 每条连接先 SET search_path TO public，
  # 即使连接角色默认 schema 不是 public，也不会把表建错位置（避免 platform 下
  # 出现 agent/run 等重复表）。
  flyway:
    default-schema: public
  datasource:
    hikari:
      connection-init-sql: SET search_path TO public

  # ── RabbitMQ（DEC-12 / ADR-001）──────────────────────────────────
  # 本地实例：./scripts/dev-rabbitmq.sh start
  rabbitmq:
    host: 127.0.0.1
    port: "5672"
    username: ${RABBITMQ_USER:agent}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:agent}
    # ⚠️ 手动确认 + 死信，配合 quorum queue 的 delivery-limit 使用。
    #    自动确认在故障场景下易造成「未处理完就丢消息」。
    listener:
      simple:
        # ⚠️ 与 agent.worker.enabled **必须同步设置**（P4-D03 实测）：
        #    @RabbitListener 端点由 RabbitBootstrap 注册，
        #    不受本项目 @Configuration 的 @ConditionalOnProperty 影响——
        #    只关 agent.worker.enabled 仍会启动容器并连 broker。
        #    生产两者均为 true；测试/无 broker 环境两者均 false。
        auto-startup: "${AGENT_WORKER_ENABLED:true}"
        acknowledge-mode: manual
        # 有副作用工具不得无限重投；与队列级 delivery-limit 共同设防
        default-requeue-rejected: "false"
        prefetch: "10"
    # ⚠️ publisher confirms：quorum queue 只有在消息被多数派复制后
    #    才确认写入成功，这是 Outbox 发布可靠性的前提。
    publisher-confirm-type: correlated
    publisher-returns: "true"
    connection-timeout: 10s

agent:
  # ── 限流（P3-D08 / D-2）─────────────────────────────────────────
  # ⚠️ 缺失即拒绝启动（fail-closed）：退回默认值等于「悄悄用了一个
  #    没人审过的限额」。初值取保守档，接入真实流量后按实测调整。
  # ⚠️ 数值必须加引号：YAML 中裸数字会被 YamlPropertiesFactoryBean 丢弃
  #    （P1 已记录的静默失效：delivery-limit 被丢弃后退回 quorum 默认 20，
  #     导致 record_weakness 重复写入 Sev-0）。
  rate-limit:
    limit-per-window: "30"
    window-seconds: "60"
    # ⚠️ P3-1 ①：false = 固定窗口（窗口边界处实际放行量可达 2×limit）
    #    true  = 滑动窗口计数近似（上一窗口按剩余时间衰减加权），
    #            消除「第 59.9s 打满 + 第 60.0s 再来一轮」的边界突发
    sliding-window: "${AGENT_RATE_LIMIT_SLIDING_WINDOW:false}"
    # ── 治理桶限额（P4-D13）────────────────────────────────────────
    # ⚠️ **必须与上面的全局限额分开**：全局限额服务的是「单个学生的个人动作」
    #    （建 Run / SSE / 状态轮询），而治理台是**一个租户的多个运维共享**
    #    （限流按租户，不按人）。用同一个阈值会让运维之间互相限流——
    #    实测：GovernanceEndpointIT 的 19 个用例同租户跑，直接拿到 429。
    #
    # ⚠️ 这两项**缺失不拒绝启动**（回落到 RateLimitPolicy 的缺省值）：
    #    治理台阈值配错只影响可用性，不会造成越权，与全局限额的 fail-closed 取舍不同。
    governance-query-limit-per-window: "120"
    governance-decide-limit-per-window: "30"

  # ── 权限影子态（P1 · 12 文 §4.5 / 13 文 §5.2）────────────────
  # ⚠️ **只有一个开关**：enabled=true 时 AuthzShadowConfiguration 生效并产出
  #    AuthzShadowBinding，仓库据此接线；false 时该 Bean 不存在，仓库保持未接线，
  #    行为与接线前逐字节一致。不存在「Bean 在、开关关」的半开状态。
  # ⚠️ 值必须加引号：YamlPropertiesFactoryBean 会丢弃裸标量（本项目已踩过该坑）。
  authz:
    shadow:
      enabled: "${AGENT_AUTHZ_SHADOW_ENABLED:false}"
      # P1 必须 false（只观测，不改变请求结果）；P2 双写期才翻 true。
      block-on-violation: "${AGENT_AUTHZ_SHADOW_BLOCK_ON_VIOLATION:false}"
      # 哨兵（共享）租户：平台域无哨兵模型，留空；RAG 域接入时填写。
      sentinel-tenant-id: "${AGENT_AUTHZ_SHADOW_SENTINEL_TENANT_ID:}"
      sampling:
        # ⚠️ 12 文原写 0.1%，评审后上调到 1%：确定性采样下单个 (主体,资源) 平均要等
        #    约 100 小时才被采到一次，两个月观察期里小流量租户可能一次都没被看过，
        #    而读数仍然是 AUTHZ_MISMATCH=0（假绿）。
        rate: "${AGENT_AUTHZ_SHADOW_SAMPLING_RATE:0.01}"
        # 分桶窗口：同一窗口内同一 (主体,资源) 采/不采恒定（可复现），窗口滚动后换样本。
        window-seconds: "${AGENT_AUTHZ_SHADOW_SAMPLING_WINDOW_SECONDS:300}"
        # 高敏资源 100% 染色（导出/检索/统计/跨租户读），与 rate 无关。
        # ⚠️ 必须与仓库传入 AuthzShadowHooks 的资源类型字面量完全一致。
        always-sample-resource-types: "${AGENT_AUTHZ_SHADOW_ALWAYS_SAMPLE:run,tool_operation,weakness_record,run_step}"
    # ── 授权决策日志（D6 / P2）──────────────────────────────────────
    # true  ⇒ 每次「被采样到」的判定写一行 platform.authz_decision_log；
    # false ⇒ NoOp（P1 影子期默认，判定不落库）。
    # ⚠️ 开启前必须已落库表结构与授权（deploy/sql/platform/01 + 03）；
    #    开启后由 AuthzDecisionLogGuard 在启动期做零行写入探测，不通过即拒绝启动 ——
    #    「开关开着、每次写失败、被限频告警吞掉」的静默无审计不可接受。
    decision-log:
      enabled: "${AGENT_AUTHZ_DECISION_LOG_ENABLED:false}"

  # ── Worker 主循环（P4-D03）──────────────────────────────────────
  # ⚠️ 以下配置**缺失即拒绝启动**（fail-closed）：退回默认值等于
  #    「悄悄用了一个没人审过的并发度」，容器化环境下可能直接
  #    打垮下游模型服务与 MQ。
  # ⚠️ 数值必须加引号：YamlPropertiesFactoryBean 会丢弃裸标量
  #    （P1 已在 delivery-limit 上踩过该坑）。
  worker:
    # 关掉即回到「消息永不消费」状态，生产必须为 true。
    # 本地无 RabbitMQ 时可设 false，仅为让上下文能启动。
    enabled: "true"
    # Outbox 中继轮询间隔（毫秒）。下限 10ms——过小等于忙等。
    # 代价：发布延迟 ≈ 该值。取舍理由见 P4-D03 §1 D-1。
    relay-interval-ms: "200"
    # 消费并发度。上限 64——过高会压垮下游模型服务。
    concurrency: "4"
    # 每消费者预取数。上限 100——过大放大重投时的重复处理窗口。
    prefetch: "10"
    # 单轮发布的 outbox 批量上限。
    outbox-batch: "50"
    # 发布失败累计上限（超过则停止重试并告警）。
    max-publish-attempts: "5"
    # ⚠️ 本实例服务的租户 slug **清单**（逗号分隔，P4-D05 / 关闭 L-4）。
    #   每个租户一个独立发布器，各自绑定自己的 tenantId。
    #   ⚠️ 不写 UUID：换环境要改配置，且没人看得出它指哪个租户。
    #   ⚠️ slug 不存在即拒绝启动——静默跳过会让消息永不发布，
    #      而系统表面完全正常（本项目已三次遇到该形态的断链）。
    #   ⚠️ 清单长度受 deployment.pilot.max-tenants 约束（灰度控制不得被绕过）。
    #   ⚠️ 同为保留期清理（P4-D04）的租户来源：两套来源迟早不一致。
    tenant-slugs: "${AGENT_TENANT_SLUGS:t-a}"
    # 租约时长（秒）：须与 RunClaimPort.DEFAULT_LEASE 同源。
    # 显式声明，避免与代码默认值静默漂移。
    lease-seconds: "30"
    # 本 Worker 实例身份（生产应为实例唯一标识）。
    id: "worker-local"

  # ── 崩溃恢复扫描（第二十一批 · 接通 claimTasks 生产调用方）────
  # ⚠️ 周期性枚举活跃租户、调用 claimTasks 接管过期 RUNNING 租约，
  #    驱动与 MQ 主路径相同的执行器，避免 worker 崩溃后 Run 永久卡死。
  # ⚠️ 数值必须加引号（YamlPropertiesFactoryBean 丢弃裸标量）。
  recovery:
    # 总开关。关闭则不扫描（fail-closed 于「显式禁用」）。
    enabled: "true"
    # 扫描间隔（秒）：上轮结束后再等该时长。下限 5s。
    interval-seconds: "30"
    # 单租户单轮接管上限（防一次捞空、压垮执行）。
    batch-size: "50"
    # 单轮枚举活跃租户上限（防租户爆炸）。
    tenant-limit: "200"
    # ⚠️ P3-1 ⑤：是否要求租户枚举端口必须可用。
    #    false = 端口缺失时仅「健康降级 + 抑制切换日志」（保留既有不阻塞启动的取舍）
    #    true  = 端口缺失即让本轮扫描失败，在调度线程可见 ——
    #            不这样做，「恢复链路已死」要等到真有 worker 崩溃那天才被发现
    require-tenant-port: "${AGENT_WORKER_RECOVERY_REQUIRE_TENANT_PORT:false}"
    # ⚠️ M1-4 / G2：挂起（等待人工审批）Run 的最长允许时长（秒）。
    #    PARK 后的 Run 不占线程、不续租；若审批决定始终没来，它会**永久停在
    #    WAITING_APPROVAL**（不报错、不告警、只是不再动）——这是静默失效。
    #    超过此时长即收敛为 FAILED（错误码 APPROVAL_TIMEOUT，工具未执行、无副作用）。
    #    ⚠️ 必须大于审批有效期（agent.approval.ttl，当前 15m），
    #    否则人还没来得及批，Run 就已经被判超时失败。
    parked-timeout-seconds: "${AGENT_WORKER_RECOVERY_PARKED_TIMEOUT_SECONDS:1800}"

  # ── 背压护栏（P4-D05 / 关闭 L-6）──────────────────────────────
  # ⚠️ 三项**全部必填**，缺失或越界即拒绝启动（fail-closed）。
  #    为什么没有安全默认值：
  #      水位过高 = 护栏形同虚设（已堆到危险水位仍全速发布）；
  #      水位过低 = 正常流量被误判为过载，调度长期停滞。
  #    两个方向都不是「保守」，故不存在可接受的兜底值。
  # ⚠️ 数值必须加引号：YamlPropertiesFactoryBean 会丢弃裸标量。
  backpressure:
    # 关掉即回到「队列无界增长且无告警」状态，生产必须为 true。
    enabled: "true"
    # 高水位线：agent.run.execute 队列深度 ≥ 此值即停止发布。
    # 初值 1000。调优时点：P4 压测实测消费速率后
    high-watermark: "1000"
    # 低水位线：深度 ≤ 此值才恢复发布（滞回，避免阈值处抖动）。
    # ⚠️ 必须严格小于高水位线，否则启动时即被拒。
    low-watermark: "200"
    # 降级后的轮询间隔倍数（队列过载时不再高频打扰 broker）。
    # 上限 20：过大等于「队列已清空却长期不恢复发布」。
    cooldown-multiplier: "4"

  # ── 数据保留与删除（P4-D04 / PIPL 未成年人）────────────────────
  # ⚠️ 五项保留期**全部必填**，缺失或越界即拒绝启动（fail-closed）。
  #    为什么说"没有安全默认值"：
  #      过短 = 违规删除（提前销毁审计举证能力，等于自行削弱 R-1/R-3）；
  #      过长 = 违规留存（PIPL 超期留存，泄露影响面随时间线性增长）。
  #    两个方向都不是「保守」，故不存在可接受的兜底值。
  # ⚠️ 数值必须加引号：YamlPropertiesFactoryBean 会丢弃裸标量。
  retention:
    # 关掉后数据从不被清理——生产必须为 true。
    # ⚠️ 与「配置缺失」的表现完全一致，差别只在日志。
    enabled: "true"
    # 学习画像保留月数（student_profile / weakness_record）
    profile-months: "12"
    # Prompt 与工具结果保留天数。到期置空，不删 run 行
    # （删 run 行会经 ON DELETE CASCADE 级联删除学生薄弱点）
    prompt-days: "90"
    # 审计日志保留天数（走受控清理通道，须声明 actor）
    audit-days: "180"
    # Trace（run_event）保留天数
    trace-days: "30"
    # 监护人撤回同意后的删除宽限天数。
    # ⚠️ 上限 30：FR-019 明文要求「30 日内删除」，超过即违反验收条款
    withdrawal-grace-days: "30"
    # 单表单轮清理上限。过大长时间锁表，过小清理太慢
    batch-size: "1000"
    # 清理轮询间隔毫秒。下限 60s——保留期是天/月级，分钟级轮询无收益
    interval-ms: "3600000"
    # ⚠️ 操作主体：审计删除的凭证责任人，不可为空（R-1）
    actor: "${AGENT_RETENTION_ACTOR:retention-job}"

    # ── P2-2 清理凭据隔离 ──────────────────────────────────────────
    # ⚠️ agent_retention 与应用角色必须是**两套凭据**：应用凭据丢失只应
    #    泄露租户数据；清理凭据丢失则能抹掉审计与删除凭证本身。
    #    合一会让前者的爆炸半径无条件升级为后者。
    # ⚠️ 接入脚本（会撤销应用角色对 audit_record / erasure_certificate
    #    的 DELETE）：deploy/sql/platform/04_retention_role.sql
    datasource:
      enabled: "${AGENT_RETENTION_DATASOURCE_ENABLED:false}"
      url: "${AGENT_RETENTION_DATASOURCE_URL:}"
      username: "${AGENT_RETENTION_DATASOURCE_USERNAME:}"
      password: "${AGENT_RETENTION_DATASOURCE_PASSWORD:}"
      # 清理是低频批处理路径，不该占用与主业务池相当的额度
      max-pool-size: "2"
    # ⚠️ 是否强制要求独立清理凭据（执行过隔离脚本的环境应设为 true）
    #    false = 回落主数据源并打印 SECURITY 告警（保留现状，因应用角色仍有 DELETE）
    #    true  = 缺清理凭据即拒绝启动（fail-closed：清理通道不得等同应用通道）
    require-isolated-credential: "${AGENT_RETENTION_REQUIRE_ISOLATED_CREDENTIAL:false}"

  # ── MQ 队列拓扑（ADR-001 §4）───────────────────────────────────
  # ⚠️ x-queue-type 与 x-delivery-limit 必须显式声明。
  #   RabbitMQ 4.x 未配置 vhost 默认队列类型时默认仍是 classic，
  #   而 classic 在 4.x 没有复制能力（mirrored queue 已在 4.0 移除）。
  #   quorum queue 默认 delivery-limit 是 20——对 record_weakness
  #   这类有副作用工具而言，重投 20 次即重复写入最多 20 次（Sev-0），
  #   故必须显式降到 3。
  #   另：队列类型一经声明不可更改，改类型需删队列重建。
  mq:
    exchange: agent.run.dispatch
    dead-letter-exchange: agent.run.dlx
    queues:
      execute:
        name: agent.run.execute
        # 有限重试后进死信转人工
        # ⚠️ 必须加引号：YAML 中裸数字会被 YamlPropertiesFactoryBean 丢弃
        delivery-limit: "3"
        dead-letter-exchange: agent.run.dlx
        dead-letter-routing-key: agent.run.dead
      # ⚠️⚠️ **原 reconcile 队列声明已删除**（P4-D11 D11-4）：
      #   它在 ADR-001 §4 的拓扑图里画着，但**代码中从未落地**——
      #   既无 {@code @Bean} 声明该队列，也无任何发布者/消费者。
      #   UNKNOWN 对账走的是 **DB 侧**（tool_operation 状态 + ToolOperationReconciliationService），
      #   不经 MQ。
      #   保留一条「看起来存在、实际不存在」的声明，等于给运维一个「系统会用它」的错觉
      #   ——这与「工具未注册为 Bean」「声明未接线」是同一族失败形态。
      #   若将来确需 MQ 对账通道，须**同时**落地队列 + 发布者 + 消费者，
      #   并在此处恢复声明。
      dead:
        name: agent.run.dead
        # 死信队列自身不再挂 DLX，避免死信循环

  # ── 消息通道（P4-D17 · 可切换消息通道）────────────────────────────
  # ⚠️ **缺失即拒绝启动**（fail-closed）：通道选错的症状是
  #    「消息静默不消费」——API 正常、无报错、无告警、Run 永远不动。
  #    回落默认值等于「悄悄用了一个没人审过的通道」。
  #
  # ⚠️ 两条通道**语义等价**（at-least-once + 有限重试 + 死信 + 背压），
  #    共用同一组端口，故切换不触碰业务语义：
  #      · rabbitmq —— 既有通道（quorum 队列 + publisher confirms + DLX）；
  #      · database —— 以 PostgreSQL 表为队列（**无外部 broker 依赖**）。
  #    故 CI / 本地开发 / 试运营小客群阶段都可无 broker 运行。
  messaging:
    # 全局通道。当前默认 database：**暂时以异步（数据库队列）替代 RabbitMQ**，
    # RabbitMQ 通道**完整保留**，改一个键即可切回。
    # ⚠️ 支持环境变量覆盖（部署时不用改文件）：
    #    AGENT_MESSAGING_MODE=rabbitmq 即切回 RabbitMQ 通道。
    #    ⚠️ 传空值 = 拒绝启动（fail-closed），不会回落默认。
    # ⚠️ 切换不是「随时热切」：切换前必须**先排空旧通道**，
    #    否则旧通道里的消息会滞留到无人消费。装配期会做残留检查并拒绝启动
    #    （见 MessagingSwitchGuard），把「静默滞留」变成「明确报错」。
    mode: "${AGENT_MESSAGING_MODE:database}"
    # ⚠️ 消息通道切换残留守卫（P4-D17）。
    #    true = 启动时校验 broker 队列深度：切到 DB 模式后 Rabbit 里的残留消息
    #          不会被接管（Run 永远不执行且无任何报错）→ 故必须先排空。
    #    ⚠️ 仅集成测试环境可关闭（application-test.yml 置 false）：测试自身会往
    #        broker 发消息（真实 broker 端到端用例），跑完必然留残留 —— 那是测试
    #        自己的产物，不该让下一轮启动被拦。关闭时会打 INFO 日志（跳过要可见）。
    switch-guard:
      rabbit-residual-check: "${AGENT_MESSAGING_SWITCH_GUARD_RABBIT_RESIDUAL:true}"
    # 租户覆盖（灰度）：形如 t-b=database,t-c=rabbitmq
    # ⚠️ 留空 = 全部租户跟随全局模式。
    # ⚠️ 模式值非法 → **拒绝启动**（灰度静默失效比报错更危险）；
    #    slug 不在本实例租户清单内 → 启动日志点名告警。
    tenant-modes: "${AGENT_MESSAGING_TENANT_MODES:}"
    # DB 队列消费轮询间隔（毫秒）。下限 10ms——过小等于忙等，会打满 CPU。
    # 代价：消费延迟 ≈ 该值（与 Outbox 中继同量级）。
    poll-interval-ms: "200"
    # 单轮单租户领取上限（对应 Rabbit 的 prefetch 量级）。
    batch-size: "50"
    # 重试次数上限（超过即进死信，须人工介入）。
    # ⚠️ 与 Rabbit 的 x-delivery-limit=3 同一意图：
    #    有副作用工具不得无限重投（重复写入 = Sev-0）。
    max-attempts: "3"
    # 可见性超时（毫秒）：领取后超过此时长未确认即被回收重投
    #（等价 broker 的 unacked 重投）。
    # ⚠️ 必须显著大于单次 Run 执行耗时；即便超时导致重复消费，
    #    安全性仍由既有的**租约 + fencing** 保证（第二个消费者领不到同一 Run）。
    visibility-timeout-ms: "300000"
    # 重试退避基数与上限（毫秒，指数退避：base × 2^(n-1)）。
    # ⚠️ 比 Rabbit 的「立即重投」更保守，避免坏消息把数据库打热。
    retry-backoff-ms: "1000"
    retry-backoff-max-ms: "30000"

  # ── DEC-9 成本与容量（保守初值，P2/P4 实测后调优）──────────────
  run:
    # 单 Run 成本上限（元）。初值 2.00。调优时点：P4 实测 usage 后
    max-cost-per-run: "2.00"
    # 单 Run 模型调用上限。初值 12。调优时点：P2 评测集实测
    max-llm-calls: "12"
    # 单 Run 最大步数。初值 20。调优时点：P2
    max-steps: "20"
    # ⚠️ 是否要求每个 Run 必须声明 timeoutMs（P2-1）
    #    false = 允许「不限时」的 Run（CreateRunRequest 既定语义，会产生 WARN 日志）
    #    true  = 未声明 timeoutMs 的创建请求在**创建期**直接拒绝（fail-closed）
    # ⚠️ 为什么默认值是 false：这是一条已被测试锁定的契约，加固只能让它显式化，
    #    不能静默改变行为。生产环境建议设为 true。
    require-timeout: false
  tenant:
    # 租户并发 Run 上限。初值 5。调优时点：P4 压测后
    max-concurrent-runs: "5"
  budget:
    # ⚠️ 单次工具调用预留额（元）。P3-D04 FR-012。
    # ⚠️ 必填，缺失即 fail-closed 拒绝工具执行 —— 禁止退回默认值放行：
    #    那等于让工具按未经配置的额度花钱（成本失控）。
    # ⚠️ 该值只是**传给 DB 的输入**，能否预留由 budget_no_overspend
    #    CHECK 与原子条件 UPDATE 裁决。调优时点：P4 实测 usage 后
    reserve-per-tool-call: "0.50"
  # ── 模型单价表（P0-3b · 成本入账）─────────────────────────────────
  # ⚠️ 为什么必须显式配置单价：
  #    usage_record 此前只记「工具调用次数 × ¥0.50」的固定代理值，
  #    input_tokens / output_tokens 两列**无任何写入方** ——
  #    「单 Run 花了多少钱 / 用了多少 token」在账上根本不存在。
  #    真实成本 = token 数 × 单价，单价是必须冻结的配置。
  # ⚠️ 计价单位是**每千 token**（per-1k），与主流供应商公开计价一致，
  #    且避免在配置里写 0.000015 这种易错位的小数。
  # ⚠️ 查不到价时：token 仍如实记录、成本按 0 记并打 WARN ——
  #    缺配置必须可见，不能静默变成「这次调用不存在」。
  # ⚠️ 键支持**最长前缀匹配**（gpt-4o-2024-08-06 命中 gpt-4o），
  #    因为模型标识常带日期/版本后缀，只做精确匹配会让「配了价却用不上」。
  # ⚠️ `default` 是**兜底条目**（仅在显式配置后生效），不是默认行为。
  pricing:
    models:
      # 内置假模型（平台自测/单测用）—— 单价记 0，账上有调用事实、无金额
      fake: { input-per-1k-tokens: "0.000000", output-per-1k-tokens: "0.000000" }
      fake-model: { input-per-1k-tokens: "0.000000", output-per-1k-tokens: "0.000000" }
      # ⚠️ 以下为**占位价**，上线前必须按供应商最新报价替换：
      #    错价会让成本报表失真（比「不记成本」更危险，因为它看起来是真的）。
      #    换供应商/换模型时**必须**同步改这里 —— 没有第二处真相源。
      gpt-4o: { input-per-1k-tokens: "0.018000", output-per-1k-tokens: "0.072000" }
      gpt-4o-mini: { input-per-1k-tokens: "0.001100", output-per-1k-tokens: "0.004300" }
      qwen-max: { input-per-1k-tokens: "0.020000", output-per-1k-tokens: "0.060000" }
      qwen-plus: { input-per-1k-tokens: "0.004000", output-per-1k-tokens: "0.012000" }
      deepseek-chat: { input-per-1k-tokens: "0.002000", output-per-1k-tokens: "0.008000" }
  tool:
    # 工具风险级别映射（P0-D00 §3.2）
    # ⚠️ 未登记的工具名一律按 WRITE_EXTERNAL 兜底（fail-closed），不会漏审批
    risk-level-map:
      get_student_profile: READ
      record_weakness: WRITE_PROFILE
  approval:
    # 按风险级别的审批要求。
    # ⚠️ 只能收紧不能放松：将 WRITE_EXTERNAL 调为非 REQUIRED 属安全门禁降级，
    #    须走 P0-D03 §6 变更模板 + ISO-5 外部抽检
    required-by-risk:
      READ: NOT_REQUIRED
      WRITE_PROFILE: OPTIONAL
      WRITE_EXTERNAL: REQUIRED
    # 审批有效期（分钟）。初值 15
    ttl: 15m
    # 审批人范围：家长或教师（与 DEC-6 角色一致）
    approver-scope: PARENT_OR_TEACHER
    # ⚠️ 是否已接入**活体**人工审批通道（P1-C · 运行时 HITL）
    #    false 表示 approvalSource 是空策略 → 需审批的工具在运行时恒被拒
    #    （安全默认，但必须在启动日志里可见，见 ApprovalReadinessGuard）
    live-source-enabled: false
    # ⚠️ 未接入活体通道且存在需审批工具时是否拒绝启动（fail-closed 升级开关）
    require-live-source: false
    # ⚠️ M2-3：审批来源模式（配置化，消除「写死在代码里、无配置入口」）
    #    none          = 无来源实现（默认）→ 需审批的工具恒 FAIL_CLOSED（安全默认）
    #    policy-engine = 按下方策略表给出结论（APPROVED / REJECTED）
    #    ⚠️ 未知模式一律**拒绝启动**（fail-closed），不静默回落 none。
    #    ⚠️ 本键与 live-source-enabled 必须自洽：source.mode=policy-engine 且
    #       策略表非空 ⇔ live-source-enabled=true；否则拒绝启动 ——
    #       两键错位会产生「以为接上了、实际恒拒」的静默失效。
    source:
      mode: none
      # 策略表（仅 mode=policy-engine 时生效）：扁平规则列表 "租户ID:工具名=结论"。
      # ⚠️ 未登记的租户/工具一律 FAIL_CLOSED（绝不默认批准）。
      # ⚠️ 结论只接受 APPROVED / REJECTED；其他值一律**拒绝启动**（fail-closed）。
      policy:
        rules: []
      # policy:
      #   rules:
      #     - "11111111-1111-1111-1111-111111111111:record_weakness=APPROVED"
  compliance:
    # ⚠️⚠️ 模型零保留确认（DEC-10 GATE-2 / R-017）
    # 零保留条款是与**特定供应商**签订的，因此按供应商分别登记。
    # 未登记的供应商一律按未确认处理（fail-closed）——
    # 新增供应商时若忘记登记，其真实数据调用会被自动拒绝，而非放行。
    #
    # ⚠️ 下列状态为「已取得书面合同承诺」。若某供应商确认状态发生变化，
    #    必须同步修改本配置并走 CHG 模板（未成年人保护强度禁止运行时下调）。
    zero-retention:
      # 已确认的供应商清单。⚠️ 未列出的供应商不允许接入真实学生数据。
      confirmed-providers: "deepseek,minimax,workbuddy"
      # 条款有效期（月）。到期后闸门自动拒绝真实数据，需重新确认。
      # ⚠️ 设为 12 仅为初值，须以合同实际到期日为准（见 D-002 清单）。
      validity-months: "12"
      # 临期告警提前天数。避免条款静默过期导致业务突然中断。
      expiry-warn-days: "30"

  # ── 告警外发（P5 · 真实告警分发通道最小实现）────────────────────
  alerts:
    # ⚠️ 默认关闭（空白 = NoopAlertWebhook）：不配置目标就不外发，
    #    避免「悄悄把审计内容发给一个没人审过的地址」。
    #    配置后仅 DENY 且定档 CRITICAL 的拒绝才 best-effort POST 外发，
    #    载荷只含定位字段（租户/主体/工具/原因码/调用标识/时刻），无凭据无参数。
    #
    # ⚠️⚠️ **本段必须挂在 agent: 下**：配置键是 agent.alerts.webhook-url，
    #   由 ApplicationConfiguration 的 @Value 逐字读取。挂到别的父键下
    #   （如 auth:）不会报错，只会让读取静默落回默认值（空串 = 通道关闭）——
    #   表现为「配了也不发」，真因离现场极远。
    webhook-url: "${AGENT_ALERT_WEBHOOK_URL:}"

  # ── 平台运维角色（BYPASSRLS · 平台级发布接入点）──────────────────
  # ⚠️ **这是平台级发布（PLATFORM 作用域）的唯一合法写入通道**：
  #   cap_config_release / cap_config_pointer / cap_decision_log 的写策略
  #   只放行「本租户的 TENANT 行」（V15/V17 注释），
  #   PLATFORM 行必须由带 BYPASSRLS 的平台运维角色写入 ——
  #   否则**任一租户都能单方面替换全平台生效配置**，那是直接的越权。
  #
  # ⚠️ **默认不启用**（enabled=false）：未接入时 PLATFORM 作用域发布
  #   **明确失败**（PlatformOpsUnavailableException），**不会**静默回落到
  #   应用角色去写、再被 RLS 拒掉 —— 后者的失败现场是「RLS 策略拒写」，
  #   离「这个环境没配运维凭据」这一真因极远。
  #
  # ⚠️ **enabled=true 但缺 url/username → 拒绝启动**（fail-closed）：
  #   声明了要用却没给凭据还继续启动，等于「以为平台运维已接入、实际没接入」。
  #
  # ⚠️ **凭据刻意与主数据源分开配置**（主数据源用 SPRING_DATASOURCE_*）：
  #   运维凭据应单独轮换、单独授权、单独审计；
  #   混在一个配置段里会让「轮换应用口令」顺手把运维口令也换了。
  #
  # ⚠️⚠️ **本段必须挂在 agent: 下**：配置键是 agent.platform-ops.datasource.*，
  #   由 PlatformOpsDataSourceConfiguration 的 KEY_* 常量逐字读取。
  #   挂到别的父键下（如 config:）不会报错，只会让读取静默落回默认值 false
  #   —— 表现为「配了环境变量也永远 fail-closed」，真因离现场极远。
  #   守卫见 ApplicationConfigKeyAlignmentTest。
  platform-ops:
    datasource:
      enabled: "${AGENT_PLATFORM_OPS_ENABLED:false}"
      url: "${AGENT_PLATFORM_OPS_DATASOURCE_URL:}"
      username: "${AGENT_PLATFORM_OPS_DATASOURCE_USERNAME:}"
      password: "${AGENT_PLATFORM_OPS_DATASOURCE_PASSWORD:}"
      # ⚠️ 池很小是刻意的：平台运维通道只服务「平台级发布」这一条低频路径，
      #    不该占用与主业务池相当的连接额度。
      max-pool-size: "2"


# ── 部署与试点 ────────────────────────────────────────────────────
deployment:
  pilot:
    # 试点租户数上限。初值 1，灰度起步。调优时点：P5 灰度扩量
    max-tenants: "1"


# ── D-001 认证（平台自建）────────────────────────────────────────
auth:
  jwt:
    # 签发方标识。非空，缺失则启动失败（fail-closed）
    issuer: "${JWT_ISSUER:https://auth.studykid.cn}"
    # 接收方标识。防止为其他服务签发的令牌被冒用
    audience: "${JWT_AUDIENCE:agent-platform}"
    # 令牌有效期（秒）。范围 60~3600，超出即启动失败
    token-ttl-seconds: "900"
    # ⚠️ RS256 私钥（Base64 的 PKCS#8 DER）。
    #    缺省为空：仅 dev profile 允许启动时生成；
    #    其余环境为空即启动失败 —— 生产若用启动生成，
    #    滚动重启会导致全员掉线。P4 接入 KMS。
    private-key: "${JWT_PRIVATE_KEY:}"
  login:
    # 连续失败达到此数即锁定
    max-failed-attempts: "5"
    # 锁定时长（分钟）
    lock-duration-minutes: "15"
    # 允许的角色白名单。⚠️ 与 Roles 权限矩阵保持一致，
    # 未登记的角色在签发与校验时均被丢弃
    # ⚠️ PLATFORM_ADMIN：平台/运维级治理角色，默认不授予任何主体；
    #    仅经 out-of-band 运维通道（deploy/sql/platform/04_platform_admin_grant.sql）
    #    写入 principal_role 权威表后生效。
    known-roles: "STUDENT,PARENT,TEACHER,TENANT_ADMIN,VIEWER,APPROVER,AGENT_AUTHOR,WORKER,PLATFORM_ADMIN"

  # ── 平台身份域（重规划 §4 / §7）：与租户令牌完全独立的受众与密钥 ──
  # ⚠️ 关键：platform-jwt.audience 必须与租户 audience（agent-platform）不同，
  #    否则两套令牌无法在令牌层互相拒绝。
  platform-jwt:
    # 平台管理 API 令牌受众（admin-console 专用）
    audience: "${PLATFORM_JWT_AUDIENCE:admin-console-api}"
    # 平台令牌有效期（秒）。可与租户令牌不同
    token-ttl-seconds: "900"
    # ⚠️ 平台专属 RS256 私钥（Base64 的 PKCS#8 DER）。
    #    建议与租户 private-key 使用不同密钥对，独立轮转。
    #    缺省为空：仅 dev profile 允许启动时生成；
    #    其余环境为空即启动失败（fail-closed，与租户密钥同纪律）。
    private-key: "${PLATFORM_JWT_PRIVATE_KEY:}"
  platform:
    login:
      # 平台角色白名单（最小特权 + 职责分离，见重规划 §3.1）。
      # 与租户 known-roles 物理隔离，互不可混。
      # ⚠️ 平台角色仍须经 out-of-band 运维通道（升级版 04_platform_admin_grant.sql）
      #    写入 platform.platform_user_role 权威表后生效；应用层不提供自授端点。
      known-roles: "PLATFORM_SUPER_ADMIN,PLATFORM_RESOURCE_ADMIN,PLATFORM_SECURITY_ADMIN,PLATFORM_AUDITOR,PLATFORM_SUPPORT,TENANT_LIFECYCLE_ADMIN"

  # ── 告警外发（P5）─────────────────────────────────────────────────
# ⚠️ 本段原挂在 auth: 下（键 auth.alerts.webhook-url），与代码读取的
#    agent.alerts.webhook-url 不一致 → 读取静默落回默认值（通道永远关闭）。
#    已移至 agent: 下，见 ApplicationConfigKeyAlignmentTest 的守卫。


# ── 灾备（P4 演练后确认）──────────────────────────────────────────
dr:
  rpo: 24h
  rto: 4h


# ── 平台安全：跨域执行票证通道 ─────────────────────────────────────
# 平台侧为「指定租户的指定成员」签发一枚短时租户令牌，
# 供 admin-console AI 实验室走真实执行链路（/api/runs 是租户域端点，
# 平台令牌打过去必然 401 —— 受众隔离按设计生效，不是缺陷）。
#
# ⚠️⚠️ **本段必须是顶层 platform:**：配置键是
#   platform.security.execution-ticket.enabled，由 PlatformExecutionTicketService
#   的 @Value 逐字读取。挂到 auth: 或 agent: 下**不会报错**，
#   只会让读取落回默认值 —— 与 platform-ops 误挂 config: 同一类事故
#   （守卫见 ApplicationConfigKeyAlignmentTest，platform. 已纳入命名空间白名单）。
#
# ⚠️ **默认开启是明确决策**（2026-10-28）：任何环境都会暴露这个「可扮演
#    任意租户执行」的端点。补偿控制全在签发这一次调用上，且缺一不可：
#    权限码 platform.tenant.execution_ticket **仅**超级管理员持有（矩阵驱动、默认拒绝）、
#    每次签发写一条平台审计（含目标租户、被扮演主体、票证 jti）、按目标租户限流、
#    TTL 60 秒。关掉本开关只用于「暂不接受跨域执行」的部署：
#    关闭后请求得到 503，**仍然留痕**。
platform:
  security:
    execution-ticket:
      enabled: "${PLATFORM_EXECUTION_TICKET_ENABLED:true}"
      # 票证有效期（秒）。下界 60 与登录令牌同源，小于即拒绝启动。
      ttl-seconds: "60"
    # ── RAG 全局语料治理票据（RAG-D11 第四刀 · 第二刀）─────────────
    # admin-console 要在控制台维护平台全局语料，但「平台域身份」不等于
    # 「被授权改动全局语料」。这里签出一枚短时效、**roles 为空**的独立凭据，
    # 带 rag_scope claim；RAG 管理面只认「域=平台 + 票据声明=PLATFORM」。
    #
    # ⚠️ 同样必须是顶层 platform: 下（键由 @Value 逐字读取，挂错父键只会落回默认值）。
    # ⚠️ **默认开**（用户定案：默认开 + 常驻补偿控制）。护栏不是「先关掉」，而是：
    #    授权码 platform.resource.manage 打在资源 rag_corpus 上（矩阵驱动、默认拒绝）、
    #    每次签发/拒绝都写一条平台审计（ALLOW 记 jti、DENY 记原因码）、
    #    按平台主体限流、TTL 上下界 60~900 秒（越界**拒绝启动**，不静默截断）。
    #    签出的票据在平台域内没有任何权限（空角色过不了授权矩阵），
    #    只在 RAG 管理面被认——这是它区别于「把登录令牌当票据用」的地方。
    #    关闭本开关后请求得到 503，**仍然留痕**。
    rag-governance-ticket:
      enabled: "${PLATFORM_RAG_GOVERNANCE_TICKET_ENABLED:true}"
      ttl-seconds: "${PLATFORM_RAG_GOVERNANCE_TICKET_TTL_SECONDS:300}"


# ── 统一配置与权限管控（W-PERM-P0 迁移期开关）──────────────────────
config:
  flag:
    # 迁移双写开关（P0-T6）。
    #
    # ⚠️ **默认改为 true（本行原为 false）**：这句「双写」已经不是可选的迁移加速，
    #    而是**执行链的前置条件** —— {@code RootAgentModelConfigProvider} 读
    #    {@code execution_capability_snapshot} 拿根 Agent 的身份（哪个 Agent 的哪个 release），
    #    读不到就 fail-closed 把 Run 判成 CONFIG_UNAVAILABLE。
    #    于是「开关默认关」的实际后果不是「少写一张表」，而是
    #    **按出厂默认启动的进程跑不了任何一个 Run**。
    #
    # ⚠️ **仍可回退**：置 false 后双写立即停止，旧读/写路径接管，
    #    且**不删除**任何已写入的新表数据（双写是「追加」不是「搬移」）。
    #    代价必须知道：回退 = 执行准入同时关闭，这是刻意保留的耦合，
    #    补偿控制是启动期与挂起期的 WARN 日志（见 CapDualWriteService）。
    #
    # ⚠️ 数值必须加引号：YamlPropertiesFactoryBean 会丢弃裸标量
    #    （P1 已在 delivery-limit 上踩过该坑）。
    cap-dual-write: "${CONFIG_FLAG_CAP_DUAL_WRITE:true}"
    # ⚠️⚠️ 能力闭包校验模式（P0-1a）——
    #    off     = 不校验（历史行为：任何已注册工具都可被任意 Agent 调用）
    #    warn    = 校验但只告警（默认；把「能力目录未装载」这个缺口变成可见的）
    #    enforce = 校验且拒绝未声明的工具（**真正关闭越权调用工具这个洞**）
    # ⚠️ 为什么默认是 warn 而不是 enforce：
    #    闭包判定的输入是**能力目录**（cap_tool_def / cap_skill_def）。
    #    目录为空时，enforce 会把**所有**工具调用拒掉 ——
    #    那不是「校验生效」，是「平台不可用」。
    #    装载能力目录后应切到 enforce，并同时开启 cap-enforcement-required
    #    （让「未开启强制」在生产拒绝启动，而不是只打一行 WARN）。
    cap-closure-enforcement: "${CONFIG_FLAG_CAP_CLOSURE_ENFORCEMENT:warn}"
    # ⚠️⚠️ 是否要求「能力闭包校验必须已强制」才允许启动（P0-1 · 硬失败开关）。
    #    true  = 闭包校验不是 enforce 时**拒绝启动**（fail-closed，不给「假防线」留后门）。
    #    false = 只在启动日志里报告（默认，便于能力目录尚未装载的环境先跑起来）。
    cap-enforcement-required: "${CONFIG_FLAG_CAP_ENFORCEMENT_REQUIRED:false}"

# ⚠️ 平台运维角色（BYPASSRLS）配置段原挂在本节之下（键 config.platform-ops.datasource.*），
#    与代码读取的 agent.platform-ops.datasource.* 不一致 → 运维通道永远 disabled，
#    PLATFORM 作用域发布永远 fail-closed。已移至 agent: 下。


# ── 健康检查（D-001 端到端 / SRE 探针）────────────────────────────
# ⚠️ 仅暴露 health，最小暴露面；其余端点保持关闭。
#    匿名可访问已在 SecurityConfiguration.PUBLIC_ENDPOINTS 中放行。
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      # 匿名访问仅返回 status（不泄露磁盘/DB 等细节）
      show-details: "never"
      probes:
        # 启用 liveness/readiness 分组，供 k8s 探针使用
        enabled: "true"


# ── HTTP 访问日志（RequestLoggingConfiguration）────────────────────
# 每行打印：<METHOD> <URI> <STATUS> <durationMs>ms；链路三要素
# [traceId tenantId principalId] 由 logback MDC 段统一带上（见 logback-spring.xml）。
# ⚠️ URI 只含 path，不含 query string：query 可能带令牌/授权码，落日志即泄露。
# ⚠️ 默认 INFO（继承 root），即每个请求一行。无需改代码即可关闭/调级：
#    关闭：logging.level.cn.studykid.multiagent.http.access=OFF
#    调 DEBUG 看更细：=DEBUG
#    环境变量等价写法：LOGGING_LEVEL_CN_STUDYKID_MULTIAGENT_HTTP_ACCESS=OFF
logging:
  level:
    cn.studykid.multiagent.http.access: "${AGENT_HTTP_ACCESS_LOG_LEVEL:INFO}"
