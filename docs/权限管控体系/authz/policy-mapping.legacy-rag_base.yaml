# =====================================================================
# 读写不对称清单（读含哨兵桶 / 写不含）—— **翻译时必须保留该区分**
#
# ⛔ 为什么单列：这些表的读策略放行到平台全局桶（哨兵），写策略不放行。
#    若把一张表的读写策略合并成一个 ScopeFilter，就会**丢掉写侧闸门**
#    ⇒ 迁移期租户可以写全局桶 ⇒ 越权。
#    迁移实现上，这张表需要**两个** ScopeFilter（读一份、写一份），
#    或一个带读写双通道的决策模型。⛔
# =====================================================================
read_write_asymmetry:
  - rag.rag_chunk — 读=TENANT_WITH_SHARED / 写=TENANT_ONLY（读含哨兵桶、写不含）
  - rag.rag_chunk_embedding — 读=TENANT_WITH_SHARED / 写=TENANT_ONLY（读含哨兵桶、写不含）
  - rag.rag_dictionary — 读=TENANT_WITH_SHARED / 写=TENANT_ONLY（读含哨兵桶、写不含）
  - rag.rag_document — 读=TENANT_WITH_SHARED / 写=TENANT_ONLY（读含哨兵桶、写不含）
  - rag.rag_edition — 读=TENANT_WITH_SHARED / 写=TENANT_ONLY（读含哨兵桶、写不含）
  - rag.rag_knowledge_point — 读=TENANT_WITH_SHARED / 写=TENANT_ONLY（读含哨兵桶、写不含）
  - rag.rag_knowledge_prerequisite — 读=TENANT_WITH_SHARED / 写=TENANT_ONLY（读含哨兵桶、写不含）
  - rag.rag_source — 读=TENANT_WITH_SHARED / 写=TENANT_ONLY（读含哨兵桶、写不含）
