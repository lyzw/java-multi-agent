spring:
  application:
    name: java-saas-rag
  datasource:
    # ⚠️ 生产必须通过环境变量（RAG_PG_*）覆盖：连接角色必须是
    #    「非特权 + 无 BYPASSRLS」的应用账号（详见 RagStartupSelfCheck）。
    #    超级用户或 rls-bypass 角色会通过启动自检被拒绝启动。
    url: ${RAG_PG_URL:jdbc:postgresql://localhost:5432/study_rag}
    username: ${RAG_PG_USERNAME:rag_app}
    password: ${RAG_PG_PASSWORD:rag_app}
    driver-class-name: org.postgresql.Driver
    hikari:
      # ⚠️ RAG 全部对象位于独立 schema `rag`（V1 迁移用 CREATE SCHEMA rag + SET search_path 固定创建），
      #    而应用 SQL 一律用**未限定表名**（FROM rag_chunk / JOIN rag_edition / ?::rag_chunk_role /
      #    rag_current_tenant()）。因此每条连接都必须把 search_path 指向 rag，
      #    否则未限定名解析不到对象（表现为 relation does not exist）。
      #    public 保留在末尾：pgvector 的 vector 类型与 Flyway 历史表都在 public。
      connection-init-sql: SET search_path TO rag, public
  flyway:
    # 迁移脚本位于 rag-infrastructure 的 classpath:db/migration（V1/V2）。
    enabled: true
    locations: classpath:db/migration
    # 不允许对未纳管库自动基线，确保迁移历史可追溯。
    baseline-on-migrate: false
    # ⚠️ 历史表必须固定在 public：连接 search_path 的首元素是 rag，若不显式指定，
    #    Flyway 会把历史表定位/创建到 rag schema，从而「看不到」public 里已有的历史记录，
    #    并误判为未迁移而重复执行 V1（CREATE TYPE 冲突直接失败）。
    default-schema: public
  jdbc:
    template:
      fetch-size: 100

rag:
  retrieval:
    # 分数门禁：低于此值的命中视为「未找到依据」，
    # 使「找不到」成为合法输出，阻断 RAG 自信地胡说（RAG-D05 §⑦）。
    min-score: ${RAG_RETRIEVAL_MIN_SCORE:0.2}

server:
  # RAG 是独立服务，默认 8081 以与主平台（platform，8080）避让。
  # ⚠️ 注意：若宿主机环境里存在 SERVER_PORT / SERVER__PORT 之类的变量，
  #    Spring 的 relaxed binding 会让它**压过本文件**（环境变量优先级高于 application.yml）。
  #    此时请用命令行参数 --server.port= 显式指定。
  port: ${RAG_SERVER_PORT:8081}
