spring:
  application:
    name: java-saas-rag
  servlet:
    multipart:
      # ⚠️ 载体上传端点（POST /sources/{sourceId}/documents）依赖 multipart 解析。
      #    默认上限 50MB：语料 PDF / EPUB 单册通常不会超此值；
      #    调大需同步调整反向代理（若有）的请求体上限。
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    # ⚠️ 生产必须通过环境变量（RAG_PG_*）覆盖：连接角色必须是
    #    「非特权 + 无 BYPASSRLS」的应用账号（详见 RagStartupSelfCheck）。
    #    超级用户或 rls-bypass 角色会通过启动自检被拒绝启动。
    url: ${RAG_PG_URL:jdbc:postgresql://localhost:5432/study_rag}
    username: ${RAG_PG_USERNAME:rag_app}
    password: ${RAG_PG_PASSWORD:rag_app}
    driver-class-name: org.postgresql.Driver
    hikari:
      # ⚠️ RAG 全部对象位于独立 schema `rag`（V1 迁移用 CREATE SCHEMA rag + SET search_path 固定创建），
      #    而应用 SQL 一律用**未限定表名**（FROM rag_chunk / JOIN rag_edition / ?::rag_chunk_role /
      #    rag_current_tenant()）。因此每条连接都必须把 search_path 指向 rag，
      #    否则未限定名解析不到对象（表现为 relation does not exist）。
      #    public 保留在末尾：pgvector 的 vector 类型在 public。
      connection-init-sql: SET search_path TO rag, public
  flyway:
    # ⛔ 迁移链 V1~V8 的脚本已从仓库删除，`classpath:db/migration` 现在是空目录。
    #    结构唯一权威源是 deploy/sql/rag/01_rag_ddl.sql（由库 owner 线下执行，
    #    与 V1→V8 实跑库 pg_dump 逐字同源、零漂移）。
    #    保持 true 只有副作用：启动打「No migrations found」告警，
    #    并在共享业务库里凭空建出一张 0 行的 public.flyway_schema_history。
    #    若日后恢复迁移脚本，改回 true 即可（历史表须继续固定在 public，
    #    否则连接 search_path 首元素 rag 会让它误判未迁移而重跑）。
    enabled: false
  jdbc:
    template:
      fetch-size: 100

rag:
  # ── 语料物理载体落盘根目录（ObjectStorePort 的本地桩实现）──────────
  # ⚠️ 这是「落桶语义的最小实现」：把上传字节写到本地目录，
  #    返回相对路径作为 objectRef。真实部署应替换为 MinIO / S3 适配器
  #    （实现同一 ObjectStorePort，调用方零改动）。
  # ⚠️ 路径穿越防护在 LocalObjectStoreAdapter 内：逻辑键被强制收束在 base-dir 内，
  #    任何 ../ 或绝对路径键都会被拒绝（最终映射为 400）。
  #    口令/凭证绝不写进本文件，目录路径同理建议用环境变量注入。
  corpus-bucket:
    base-dir: ${RAG_CORPUS_BUCKET_BASE_DIR:./corpus-bucket}
  # ── 评审 P0-6（fail-closed）：本地占位端口显式启用开关 ──
  # 占位解析/嵌入/蕴含实现默认拒绝装配（应用拒绝启动）；仅本地开发/链路验证时置 true。
  # 置 true 会被启动横幅以 ERROR 级记录，不会被静默忽略。
  local-ports:
    enabled: ${RAG_LOCAL_PORTS_ENABLED:false}
  # ── 平台全局语料运维通道（RAG-D11 第四刀·第二刀）──────────────────
  # 平台档（X-Rag-Scope: PLATFORM）的<b>写</b>动作走这条独立角色 + 独立连接池，
  # 而不是放宽所有租户共用的 rag_app：rag_app 的写策略含 scope='TENANT'，
  # 那正是「应用角色写不出全局行」的越权闸门（反证 P4 钉着它）。
  #
  # ⚠️ 默认<b>开</b>（用户定案：默认开 + 常驻补偿控制，不用「先关掉」当护栏）。
  #    enabled=true 而 url/username 缺失时<b>拒绝启动</b>，不静默降级成哑通道：
  #    后者的表现是一辈子 503，看起来像后端故障，谁也查不到是配置问题。
  #    本地不接运维库的部署要显式写 RAG_OPS_ENABLED=false（此时平台档写 → 503，
  #    租户档与检索链路完全不受影响）。
  #
  # ⚠️ 必须用 <b>非主数据源角色</b>：rag_ops 带 BYPASSRLS，
  #    若与 spring.datasource 同一个角色，租户隔离整体失效
  #    （启动自检会断言两者用户名不同）。
  #    角色与授权见 deploy/sql/rag/05_rag_ops_role.sql。
  # ⚠️ 口令只从环境变量注入，绝不写进本文件。
  ops:
    enabled: ${RAG_OPS_ENABLED:true}
    datasource:
      url: ${RAG_OPS_DATASOURCE_URL:}
      username: ${RAG_OPS_DATASOURCE_USERNAME:}
      password: ${RAG_OPS_DATASOURCE_PASSWORD:}
      # 池上限刻意小：全局语料写是<b>低频治理动作</b>，
      # 给一个大池只会让「控制台被当成导入工具」成为可能。
      max-pool-size: ${RAG_OPS_DATASOURCE_MAX_POOL_SIZE:2}
  # ── 嵌入模型（OpenAI 兼容 /embeddings）────────────────────────
  # base-url 为空 = 不接真实模型，退回本地确定性占位并受上面的 fail-closed 闸门约束。
  # ⚠️ 密钥只从环境变量注入，绝不写进本文件（也不提交任何本地网关的 key）。
  # ⚠️ dimension 必须与 rag_chunk_embedding.embedding 列的维度一致，
  #    不一致时嵌入适配器在<b>取回第一条向量</b>时就失败，而不是写库时才炸。
  embedding:
    base-url: ${RAG_EMBEDDING_BASE_URL:}
    api-key: ${RAG_EMBEDDING_API_KEY:}
    model: ${RAG_EMBEDDING_MODEL:}
    dimension: ${RAG_EMBEDDING_DIMENSION:1024}
    batch-size: ${RAG_EMBEDDING_BATCH_SIZE:16}
    timeout-seconds: ${RAG_EMBEDDING_TIMEOUT_SECONDS:120}
    # 向量列类型（只能 vector / halfvec，白名单校验）。
    # HNSW 索引的维度上限：vector 2000、halfvec 4000；超上限只能存储、建不了 ANN 索引。
    # 维度不在这里配：取自嵌入端口的 dimension()，两处只允许有一个权威源。
    vector-type: ${RAG_EMBEDDING_VECTOR_TYPE:vector}
  retrieval:
    # 分数门禁：低于此值的命中视为「未找到依据」，
    # 使「找不到」成为合法输出，阻断 RAG 自信地胡说（RAG-D05 §⑦）。
    # 0.38 = 2026-10-28 用真实嵌入模型（qwen3-embedding:8b）+ 沪教版两册语料标定的结果：
    #   正例命中中位 0.504、跨领域负对照中位 0.339（p75=0.366）。
    #   0.38 是「砍掉 24/27 条跨领域噪声且正例保留率仍是 100%」的第一个阈值；
    #   再往上调（≥0.42）开始吃掉正例，却仍拦不住近邻负例（其上限 0.525 > 正例 p25 0.465），
    #   即「同体裁的无关词」不是分数门禁能解决的问题，要靠重排序/知识点过滤。
    # ⚠️ 换嵌入模型或换语料后此值必须重新标定（RAG-D08 §4 / RD-Q2）。
    min-score: ${RAG_RETRIEVAL_MIN_SCORE:0.38}
    # ── 评审 P0-7（G-3）：允许检索的最低权威等级（部署级服务端策略）──
    # ⚠️ 默认 OFFICIAL_TUTORIAL（RAG-R07 生产下限）。绝不读调用方请求头；
    #    逐租户差异化门槛待 platform 侧字段落地（RAG-R23）后随请求下发。
    min-trust-tier: ${RAG_RETRIEVAL_MIN_TRUST_TIER:OFFICIAL_TUTORIAL}
  security:
    # ── 评审 P0-2：JWT 鉴权 + X-Tenant-Id 归属绑定 ──────────────────
    # ⚠️ fail-closed：公钥未配置时「启用」组合在启动即失败；
    #    enabled=false 是仅限本地开发的显式逃生门（启动打 ERROR 横幅）。
    enabled: ${RAG_SECURITY_ENABLED:true}
    tenant:
      # 租户令牌域（aud=agent-platform）：强制 X-Tenant-Id == 令牌 tenant_id
      public-key: ${RAG_TENANT_JWT_PUBLIC_KEY:}
      issuer: ${RAG_TENANT_JWT_ISSUER:https://auth.studykid.cn}
      audience: ${RAG_TENANT_JWT_AUDIENCE:agent-platform}
    platform:
      # 平台令牌域（aud=admin-console-api）：跨租户治理属设计内（平台自身有权限闸门）
      public-key: ${RAG_PLATFORM_JWT_PUBLIC_KEY:}
      issuer: ${RAG_PLATFORM_JWT_ISSUER:https://auth.studykid.cn}
      audience: ${RAG_PLATFORM_JWT_AUDIENCE:admin-console-api}

server:
  # RAG 是独立服务，默认 8081 以与主平台（platform，8080）避让。
  # ⚠️ 注意：若宿主机环境里存在 SERVER_PORT / SERVER__PORT 之类的变量，
  #    Spring 的 relaxed binding 会让它**压过本文件**（环境变量优先级高于 application.yml）。
  #    此时请用命令行参数 --server.port= 显式指定。
  port: ${RAG_SERVER_PORT:8081}
