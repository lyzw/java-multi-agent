spring:
  application:
    name: java-saas-rag-worker
  datasource:
    # ⚠️ 生产必须通过环境变量（RAG_PG_*）覆盖：连接角色必须是
    #   「非特权 + 无 BYPASSRLS」的应用账号（见 ReindexRunner 的 fail-closed 探针）。
    #   超级用户或 rls-bypass 角色会破坏租户隔离。
    url: ${RAG_PG_URL:jdbc:postgresql://localhost:5432/study_rag}
    username: ${RAG_PG_USERNAME:rag_app}
    password: ${RAG_PG_PASSWORD:rag_app}
    driver-class-name: org.postgresql.Driver
    hikari:
      # ⚠️ 同 rag-bootstrap：RAG 对象在独立 schema `rag`，应用 SQL 用未限定表名，
      #    每条连接必须把 search_path 指向 rag，否则解析不到对象。
      connection-init-sql: SET search_path TO rag, public
  flyway:
    # ⛔ 同 rag-bootstrap：迁移脚本已删除，结构以 deploy/sql/rag/01_rag_ddl.sql 为准。
    #    保持 true 会在共享库凭空建出一张 0 行的 public.flyway_schema_history，
    #    并让启动日志打出「No migrations found」告警。
    enabled: false
  jdbc:
    template:
      fetch-size: 100

rag:
  # ── 评审 P0-6（fail-closed）：本地占位端口显式启用开关 ──
  # 占位解析/嵌入/蕴含实现默认拒绝装配（应用拒绝启动）；仅本地开发/链路验证时置 true。
  local-ports:
    enabled: ${RAG_LOCAL_PORTS_ENABLED:false}
  # 嵌入模型（OpenAI 兼容 /embeddings）——属性名与 rag-bootstrap 完全一致：
  # 索引向量与查询向量必须同源同模型，两处配置项一旦漂移就是「检索恒低分且不报错」。
  # ⚠️ 密钥只从环境变量注入。
  embedding:
    base-url: ${RAG_EMBEDDING_BASE_URL:}
    api-key: ${RAG_EMBEDDING_API_KEY:}
    model: ${RAG_EMBEDDING_MODEL:}
    dimension: ${RAG_EMBEDDING_DIMENSION:1024}
    batch-size: ${RAG_EMBEDDING_BATCH_SIZE:16}
    timeout-seconds: ${RAG_EMBEDDING_TIMEOUT_SECONDS:120}
    # 向量列类型（只能 vector / halfvec，白名单校验）。
    # HNSW 索引的维度上限：vector 2000、halfvec 4000；超上限只能存储、建不了 ANN 索引。
    # 维度不在这里配：取自嵌入端口的 dimension()，两处只允许有一个权威源。
    vector-type: ${RAG_EMBEDDING_VECTOR_TYPE:vector}
  indexer:
    # 启动即触发重索引（仅本 Worker 应用默认开启）。
    auto-start: true
    # 每页扫描的待索引片段数（键集分页）。
    batch-size: 200
    # ⚠️ 受 RLS 约束，Worker 无法跨租户枚举 rag_tenant，须显式列出租户 UUID。
    #    生产建议由主平台在创建/校验来源后下发索引任务（见 ReindexRunner 注释）。
    tenants: []

logging:
  level:
    cn.studykid.rag.worker: INFO
