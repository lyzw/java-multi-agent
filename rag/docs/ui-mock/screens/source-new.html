<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来源登记 · RAG 语料管理</title>
<link rel="stylesheet" href="../assets/ui.css">
</head>
<body data-page="source-new">
<script src="../assets/shell.js"></script>
<script>
shell('录入与校对 / 来源登记', '租户档');
document.getElementById('content').innerHTML = `
<div class="page-head">
  <div>
    <div class="page-title">来源登记</div>
    <div class="page-desc">登记一个来源（作品级），录入版本五轴、权威等级与版权状态。五轴缺一不可入库。</div>
  </div>
</div>

<div class="grid-2-1">
  <div class="card card-pad">
    <div class="card-title">① 基本信息</div>
    <div class="field"><label class="req">来源名称（书名）</label><input type="text" style="width:100%" placeholder="例如：义务教育教科书 · 数学 七年级上册"></div>
    <div class="grid-2">
      <div class="field"><label class="req">出版社</label><select style="width:100%"><option>人民教育出版社</option><option>上海教育出版社</option><option>北京师范大学出版社</option></select></div>
      <div class="field"><label class="req">版次</label><input type="text" style="width:100%" placeholder="2024 修订"></div>
    </div>

    <div class="card-title" style="margin-top:20px">② 版本五轴</div>
    <div class="notice info"><span>ℹ️</span><span>五轴是「可检索版本」的基础坐标（RAG-D00 RD-03），缺任一轴来源无法入库。</span></div>
    <div class="grid-2">
      <div class="field"><label class="req">学科 Subject</label><select style="width:100%"><option>数学</option><option>英语</option><option>语文</option></select></div>
      <div class="field"><label class="req">年级 GradeBand</label><select style="width:100%"><option>七年级</option><option>八年级</option></select></div>
      <div class="field"><label class="req">册次 Term</label><select style="width:100%"><option>上册</option><option>下册</option></select></div>
      <div class="field"><label class="req">出版社 Publisher</label><select style="width:100%"><option>人教版</option><option>沪教版</option></select></div>
    </div>

    <div class="card-title" style="margin-top:20px">③ 授权与权威</div>
    <div class="grid-2">
      <div class="field"><label class="req">权威等级 TrustTier</label><select style="width:100%"><option>OFFICIAL_TUTORIAL · 官方教辅</option><option>OFFICIAL_PUBLISHER · 官方出版社</option><option>UNVERIFIED · 未校验</option></select></div>
      <div class="field"><label class="req">版权状态 license_status</label><select style="width:100%"><option>LICENSED · 已授权</option><option>RESTRICTED · 受限</option><option>PENDING · 待确认</option></select></div>
    </div>

    <div class="card-title" style="margin-top:20px">④ 教材正文</div>
    <div class="field"><label class="req">上传 PDF</label>
      <div style="border:2px dashed var(--border-strong);border-radius:var(--r-8);padding:28px;text-align:center;color:var(--text-3)">
        <div style="font-size:26px">📄</div>
        <div style="margin:6px 0">拖拽 PDF 到此处，或 <span style="color:var(--brand-600);font-weight:600">点击选择文件</span></div>
        <div class="small">支持 .pdf，单个 ≤ 200 MB · 教材正文不入库，仅存对象存储引用</div>
      </div>
    </div>

    <div class="row" style="margin-top:20px">
      <button class="btn btn-primary">登记来源</button>
      <button class="btn">取消</button>
    </div>
  </div>

  <div class="stack">
    <div class="card card-pad">
      <div class="card-title">五轴完整性提示</div>
      <div class="notice warn"><span>⚠️</span><span>版本五轴（学科·年级·册次·出版社·版次）缺任一轴，来源无法入库，且不会进入检索。</span></div>
      <div class="small muted">当前：学科 ✓ · 年级 ✓ · 册次 ✓ · 出版社 ✓ · 版次（待填）</div>
    </div>
    <div class="card card-pad">
      <div class="card-title">权威等级对「可被检索」的影响</div>
      <div class="small" style="color:var(--text-2);line-height:1.7">
        「入库可、检索不可」分离策略（RAG-D00 RD-02）：<br>
        · <span class="badge b-verified">VERIFIED</span> 且达门槛 → 可检索<br>
        · <span class="badge b-pending">UNVERIFIED</span> → 仅入库供审核比对，不参与检索<br>
        权威门槛由服务端配置 <span class="mono">rag.retrieval.min-trust-tier</span>（默认 OFFICIAL_TUTORIAL）。
      </div>
    </div>
  </div>
</div>`;
</script>
</body>
</html>
