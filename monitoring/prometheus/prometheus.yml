global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Java 多智能体应用（Micrometer/Actuator 暴露的 /actuator/prometheus）
  # host.docker.internal：应用跑在宿主机（8080），Prometheus 跑在容器内
  - job_name: java-multi-agent
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
