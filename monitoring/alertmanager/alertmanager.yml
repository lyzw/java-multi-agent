# Alertmanager 路由（O6）。
#
# ⚠️ 接收端默认留空（null），必须显式配置 webhook 才真正发送——fail-closed：
#    宁可告警不投递也不误发到错误地址。部署时用环境变量或替换 receiver 配置。
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    # 生产接入时把下面注释解开并填入真实 webhook（密钥经环境注入，不进仓库）。
    # webhook_configs:
    #   - url: 'https://example.com/alert-hook'
    #     send_resolved: true

inhibit_rules:
  # 实例整体不可用时，抑制其上派生的细粒度告警，避免告警风暴。
  - source_matchers: ['alertname = "AgentInstanceDown"']
    target_matchers: ['severity != "critical"']
    equal: ['instance']
